<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Deployment Pipeline</title>
  <style>body{font-family:system-ui;max-width:40rem;margin:4rem auto;padding:0 1rem}code{background:#eee;padding:.1em .4em}</style>
</head>
<body>
  <h1>Deployed via GitHub Actions 🚀</h1>
  <p>Running on a local Vagrant VM through a self-hosted runner.</p>
  <p>Commit: <code id="sha">loading…</code></p>
  <script>
    fetch('/version.txt').then(r => r.text()).then(t => sha.textContent = t.trim().slice(0, 7));
  </script>
</body>
</html>
