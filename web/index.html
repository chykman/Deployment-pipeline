<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deployment Pipeline</title>
  <style>
    :root { color-scheme: light dark; --bd: #8884; --muted: #888; --ok: #1a9d4b; --bad: #d33; }
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1rem; }
    h1 { margin-bottom: .25rem; }
    .sub { color: var(--muted); margin-top: 0; }
    .meta { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; padding: 1rem;
            border: 1px solid var(--bd); border-radius: .5rem; font-size: .9rem; }
    .meta dt { color: var(--muted); } .meta dd { margin: 0; font-family: ui-monospace, monospace; }
    .dot { display:inline-block; width:.6rem; height:.6rem; border-radius:50%; background: var(--muted); margin-right:.4rem; }
    .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
    form { display: flex; gap: .5rem; margin: 1.5rem 0 1rem; }
    input[type=text] { flex: 1; padding: .5rem .6rem; font: inherit; }
    button { font: inherit; padding: .5rem .9rem; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: .6rem; padding: .5rem 0; border-bottom: 1px solid var(--bd); }
    li.done span { text-decoration: line-through; color: var(--muted); }
    li span { flex: 1; word-break: break-word; }
    .err { color: var(--bad); min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Deployed via GitHub Actions 🚀</h1>
  <p class="sub">nginx → Node API → PostgreSQL, running on a local Vagrant VM.</p>

  <dl class="meta">
    <dt>Commit</dt>   <dd id="sha">…</dd>
    <dt>API</dt>      <dd><span class="dot" id="dot"></span><span id="api">checking…</span></dd>
    <dt>Database</dt> <dd id="db">…</dd>
    <dt>API started</dt> <dd id="started">…</dd>
  </dl>

  <form id="form">
    <input type="text" id="title" maxlength="200" placeholder="Add a task (saved in PostgreSQL)" required>
    <button>Add</button>
  </form>
  <div class="err" id="err"></div>
  <ul id="list"></ul>

<script>
  const $ = (id) => document.getElementById(id);

  async function call(path, opts) {
    const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    return r.status === 204 ? null : r.json();
  }
  const showErr = (e) => { $('err').textContent = e ? e.message : ''; };

  async function loadInfo() {
    try {
      const i = await call('/api/info');
      $('sha').textContent = i.gitSha.slice(0, 7);
      $('db').textContent = i.dbVersion;
      $('started').textContent = new Date(i.startedAt).toLocaleString();
      $('api').textContent = 'healthy';
      $('dot').className = 'dot ok';
    } catch (e) {
      $('api').textContent = 'unreachable';
      $('dot').className = 'dot bad';
    }
  }

  async function loadTasks() {
    const list = $('list');
    list.replaceChildren();
    for (const t of await call('/api/tasks')) {
      const li = document.createElement('li');
      if (t.done) li.className = 'done';
      const cb = Object.assign(document.createElement('input'), { type: 'checkbox', checked: t.done });
      cb.onchange = () => call('/api/tasks/' + t.id, { method: 'PATCH' }).then(loadTasks).catch(showErr);
      const span = document.createElement('span');
      span.textContent = t.title;
      const del = document.createElement('button');
      del.textContent = '✕';
      del.onclick = () => call('/api/tasks/' + t.id, { method: 'DELETE' }).then(loadTasks).catch(showErr);
      li.append(cb, span, del);
      list.append(li);
    }
  }

  $('form').onsubmit = async (e) => {
    e.preventDefault();
    try {
      await call('/api/tasks', { method: 'POST', body: JSON.stringify({ title: $('title').value }) });
      $('title').value = '';
      showErr(null);
      await loadTasks();
    } catch (err) { showErr(err); }
  };

  loadInfo();
  loadTasks().catch(showErr);
</script>
</body>
</html>
